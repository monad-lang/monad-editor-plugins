name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Package (VSIX)
        run: pnpm package
      - uses: actions/upload-artifact@v4
        with:
          name: monad-vsix
          path: vscode/*.vsix
          if-no-files-found: error

  zed:
    name: Zed extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zed
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zed
      - run: cargo check
      - run: cargo clippy -- -D warnings

  sample:
    name: sample/tour.mo type-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install monadup toolchain
        run: |
          curl -fsSL https://monad-lang.org/install | bash
          echo "$HOME/.monad/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.monad/bin:$PATH"
          monadup default
      - run: monad check sample/tour.mo
